name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  fmt-and-clippy:
    name: fmt + clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # shiki-desktop (tauri) is a workspace member, so ubuntu needs the
      # webkit2gtk/GTK dev headers tauri's wry/webkit2gtk-rs crates link
      # against — the default runner doesn't ship them.
      - if: matrix.os == 'ubuntu-latest'
        name: Install Linux Tauri system deps
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev
      # fmt is platform-independent — only worth running once, and clippy's
      # own output would otherwise get needlessly duplicated 3x in the logs.
      - if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      # Matrixed rather than ubuntu-only: shiki-core/src/editor.rs has
      # `#[cfg(target_os = "macos")]`/`#[cfg(target_os = "windows")]` blocks
      # that an ubuntu-only clippy run would never actually lint.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  theme-drift:
    name: theme drift (Rust vs docs)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: python scripts/gen-themes.py --check

  audit:
    name: cargo audit (dependency vulnerabilities)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Catches new RUSTSEC advisories on an ongoing basis — the git2 0.19
      # -> 0.21 bump (see CHANGELOG/CLAUDE.md) was a one-time manual audit;
      # nothing re-checked automatically for a *new* advisory landing after
      # that, until this job. `cargo audit` auto-discovers `.cargo/audit.toml`
      # (repo root, checked out by actions/checkout above) for an ignore
      # list — see that file for how to allowlist a known, tracked,
      # not-yet-fixable transitive advisory instead of this job blocking
      # every merge indefinitely once one is found.
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  # Guards the "shiki-core/shiki-config are portable to a non-native target"
  # property that made `git2`/`self_update`/`libc`/`directories` Cargo
  # features (default-on) and `comrak`'s `syntect-onig`/Oniguruma backend
  # disabled by default in the first place — without a dedicated job like
  # this, that property silently rots the next time someone adds a
  # dependency or touches an OS-`cfg`-gated function (this repo has already
  # been burned once by an unverified assumption quietly going stale, see
  # the auto-tag/release.yml history in CLAUDE.md). Deliberately scoped to
  # `-p shiki-core --no-default-features`/`-p shiki-config`, never
  # `--workspace`/`--all-features`: the terminal crates (shiki-tui/
  # shiki-cli/shiki-desktop/shiki-native-host) are native-only by design and
  # were never meant to target wasm, and `--all-features` would
  # (correctly) fail here since `git2`/`self_update`/`libc`/`directories`
  # are inherently native. `cargo check`, not `cargo build`/`test` — wasm32
  # code here has never been exercised at runtime (no wasm-bindgen glue, no
  # JS host), only proven to type-check and link.
  wasm-portability:
    name: wasm32 portability check (shiki-core, shiki-config)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p shiki-core --no-default-features --target wasm32-unknown-unknown --locked
      - run: cargo check -p shiki-config --target wasm32-unknown-unknown --locked

  # A single job, not separate `build`/`test` jobs — `cargo test --workspace`
  # already compiles every lib/bin target in the workspace (in test profile)
  # on its way to running the tests, so a prior version of this file that
  # ran `cargo check` + `cargo build` as a *second*, separate job was paying
  # for close to the same compilation twice, on every push/PR, across all 3
  # OSes. `cargo check` still runs first, as a fast fail-fast gate before
  # paying for the slower full test build.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: matrix.os == 'ubuntu-latest'
        name: Install Linux Tauri system deps
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev
      - run: cargo check --workspace --locked
      - run: cargo test --workspace --locked
