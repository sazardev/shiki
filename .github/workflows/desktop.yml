name: Desktop build

# Builds the Windows desktop app (MSI + NSIS installers) and keeps the
# artifacts downloadable from the Actions run — the same steps release.yml's
# desktop-build job runs on every tag, minus the GitHub Release upload. This
# is what validates the desktop pipeline on every push (and on demand via
# workflow_dispatch) without cutting a release.
on:
  workflow_dispatch:
  push:
    paths:
      - 'shiki-desktop/**'
      - '.github/workflows/desktop.yml'
      - '.github/workflows/release.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches: [main]
    paths:
      - 'shiki-desktop/**'
      - '.github/workflows/desktop.yml'
      - '.github/workflows/release.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'

jobs:
  build:
    name: Build desktop installers (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-windows

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shiki-desktop/ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: shiki-desktop/ui
        run: npm ci

      - name: Build desktop installers
        shell: bash
        working-directory: shiki-desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export PATH="$PWD/ui/node_modules/.bin:$PATH"
          # Dependabot-triggered runs never receive repo secrets (GitHub
          # withholds them from that vault). With `createUpdaterArtifacts:
          # true` and no key, `tauri build` fails outright, which made every
          # Dependabot PR red. Fall back to an unsigned local build there:
          # the installers are still produced and uploaded, only the updater
          # signature (which a non-release PR has nowhere to publish anyway)
          # is skipped.
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
          else
            tauri build
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: shiki-desktop-windows
          # The workspace shares one target dir at the repo root, so tauri's
          # bundle output lands in target/release/bundle/ (repo-root-relative),
          # not under shiki-desktop/.
          path: target/release/bundle/
          if-no-files-found: error