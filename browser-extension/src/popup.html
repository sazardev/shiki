<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shiki Capture</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">
    <header>
      <div class="brand">
        <img src="../icons/icon32.png" alt="Shiki" class="brand-icon" width="20" height="20" />
        <span class="brand-name">Shiki</span>
        <span class="brand-kanji">私記</span>
      </div>
      <div id="daemon-status" class="status" title="Capture daemon status">checking…</div>
    </header>

    <div class="quick-row">
      <button id="quick-selection" class="ghost" title="Capture current selection instantly">✦ Capture selection</button>
      <button id="quick-page" class="ghost" title="Capture current page title + URL">⎙ Capture page</button>
    </div>

    <div class="field">
      <label for="notebook">Notebook</label>
      <div class="row">
        <select id="notebook"></select>
        <button id="refresh" title="Refresh notebooks" aria-label="Refresh">↻</button>
      </div>
    </div>

    <div class="field">
      <label for="folder">Folder <span class="muted">— optional</span></label>
      <div class="row">
        <select id="folder"></select>
        <input id="folder-custom" placeholder="custom: work/meetings" />
      </div>
    </div>

    <div class="field">
      <label for="tags">Tags <span class="muted">— comma separated</span></label>
      <input id="tags" placeholder="work, idea" />
    </div>

    <label class="checkbox">
      <input type="checkbox" id="daily" />
      <span>Append to today's daily note</span>
    </label>

    <div class="field">
      <label for="text">Note <span class="muted">— Tip: “work: call Ana” routes automatically</span></label>
      <textarea id="text" placeholder="Quick idea…"></textarea>
      <div id="selection-hint" class="hint hidden">↳ Selection from page prefilled</div>
    </div>

    <div class="actions">
      <button id="capture" class="primary">Capture <span class="kbd">↵</span></button>
      <button id="copy-capture" title="Copy to clipboard + Capture (copy y mandar)">⎘ Copy + Send</button>
      <button id="copy-only" title="Copy note to clipboard">Copy</button>
    </div>
    <div class="actions" style="margin-top: -4px;">
      <button id="save-defaults" title="Save as defaults for next time" style="flex:1">Remember defaults</button>
    </div>

    <div id="result" class="result hidden" role="status"></div>

    <footer>
      <span id="config-path" class="muted mono" title="Config path"></span>
      <span class="spacer"></span>
      <a href="#" id="open-help" title="Open Shiki docs">Docs</a>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
