<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shiki Capture</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">
    <header>
      <div class="brand">
        <img src="../icons/icon32.png" alt="Shiki" class="brand-icon" width="20" height="20" />
        <span class="brand-name">Shiki</span>
        <span class="brand-kanji">私記</span>
      </div>
      <div class="header-actions">
        <button id="undo-btn" class="icon-btn" title="Undo last capture">↩</button>
        <div id="daemon-status" class="status" title="Capture daemon status">checking…</div>
      </div>
    </header>

    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="capture" role="tab" aria-selected="true">Capture</button>
      <button class="tab" data-tab="search" role="tab">Search</button>
      <button class="tab" data-tab="recent" role="tab">Recent</button>
      <button class="tab" data-tab="logs" role="tab">Logs</button>
    </nav>

    <!-- Capture tab -->
    <section id="tab-capture" class="tab-pane active" role="tabpanel">
      <div class="quick-row">
        <button id="quick-selection" class="ghost" title="Fill with current selection">✦ Selection</button>
        <button id="quick-page" class="ghost" title="Fill with page title+URL">⎙ Page</button>
      </div>

      <div class="field">
        <label for="notebook">Notebook</label>
        <div class="row">
          <select id="notebook"></select>
          <button id="refresh" title="Refresh" aria-label="Refresh">↻</button>
        </div>
        <div id="encrypt-warn" class="warn hidden">🔒 Encrypted — unlock in TUI first</div>
      </div>

      <div class="field">
        <label for="folder">Folder <span class="muted">— optional</span></label>
        <div class="row">
          <select id="folder"></select>
          <input id="folder-custom" placeholder="custom: work/meetings" list="folder-suggestions" />
          <datalist id="folder-suggestions"></datalist>
          <button id="create-folder" class="icon-btn" title="Create folder">＋</button>
        </div>
      </div>

      <div class="field row-2">
        <div class="field half">
          <label for="template">Template</label>
          <select id="template"><option value="">(default)</option></select>
        </div>
        <div class="field half">
          <label for="tags">Tags</label>
          <input id="tags" placeholder="work, idea" list="tags-suggestions" />
          <datalist id="tags-suggestions"></datalist>
        </div>
      </div>

      <label class="checkbox">
        <input type="checkbox" id="daily" />
        <span>Append to today's daily note</span>
      </label>

      <div class="field">
        <label for="text">Note <span class="muted">— “work: call Ana” routes automatically</span></label>
        <textarea id="text" placeholder="Quick idea…"></textarea>
        <div id="selection-hint" class="hint hidden">↳ Selection prefilled</div>
      </div>

      <div class="actions">
        <button id="capture" class="primary">Capture <span class="kbd">↵</span></button>
        <button id="copy-capture" title="Copy + Capture">⎘ Copy+Send</button>
        <button id="copy-only" title="Copy to clipboard">Copy</button>
      </div>
      <div class="actions" style="margin-top:-4px">
        <button id="save-defaults" style="flex:1">Remember defaults</button>
      </div>
    </section>

    <!-- Search tab -->
    <section id="tab-search" class="tab-pane" role="tabpanel">
      <div class="field">
        <label for="search-input">Search notes (title + body)</label>
        <input id="search-input" placeholder="fuzzy search titles…" autocomplete="off" />
      </div>
      <div id="search-results" class="list empty">
        <div class="empty-state">Type to search across all notebooks</div>
      </div>
    </section>

    <!-- Recent tab -->
    <section id="tab-recent" class="tab-pane" role="tabpanel">
      <div class="row" style="justify-content: space-between; align-items:center">
        <label style="margin:0">Recent notes</label>
        <button id="recent-refresh" class="ghost small">↻ Refresh</button>
      </div>
      <div id="recent-list" class="list"><div class="empty-state">Loading…</div></div>
    </section>

    <!-- Logs tab -->
    <section id="tab-logs" class="tab-pane" role="tabpanel">
      <div class="row" style="justify-content: space-between; align-items:center">
        <label style="margin:0">Logs <span class="muted" id="logs-count"></span></label>
        <div class="row" style="gap:4px">
          <button id="logs-refresh" class="ghost small" title="Refresh logs">↻</button>
          <button id="logs-clear" class="ghost small" title="Clear logs">Clear</button>
          <button id="logs-export" class="ghost small" title="Export logs">Export</button>
        </div>
      </div>
      <div id="logs-list" class="list" style="font-family: ui-monospace, monospace; font-size:11px; max-height:220px"></div>
      <div class="small" style="color:var(--muted)">Tip: si el menú “Send to notebook” no aparece, revisa aquí el error de <code>rebuildMenus</code> y ejecuta Test host en Options.</div>
    </section>

    <div id="result" class="result hidden" role="status"></div>

    <footer>
      <span id="config-path" class="muted mono" title="Config path"></span>
      <span class="spacer"></span>
      <a href="#" id="open-options">Options</a>
      <span class="muted">·</span>
      <a href="#" id="open-help">Docs</a>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
