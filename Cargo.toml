[workspace]
resolver = "2"
members = [
    "shiki-core",
    "shiki-config",
    "shiki-tui",
    "shiki-cli",
]

[workspace.package]
version = "0.8.8"
edition = "2021"
authors = ["Omar"]
license = "MIT"
repository = "https://github.com/sazardev/shiki"
description = "shiki (私記) - TUI note-taking app written in Rust"
keywords = ["notes", "tui", "markdown", "git", "cli"]
categories = ["command-line-utilities", "text-editors"]

[workspace.dependencies]
shiki-core = { path = "shiki-core", version = "0.8.2" }
shiki-config = { path = "shiki-config", version = "0.8.2" }
shiki-tui = { path = "shiki-tui", version = "0.8.2" }

ratatui = "0.30"
crossterm = "0.29"
tokio = { version = "1", features = ["full"] }
git2 = { version = "0.21", features = ["ssh", "https", "vendored-libgit2", "vendored-openssl"] }
comrak = "0.54"
syntect = "5"
tui-textarea = "0.7"
nucleo-matcher = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
notify = "6"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
pulldown-cmark = "0.12"
anyhow = "1"
thiserror = "2"
directories = "6"
uuid = { version = "1", features = ["v4"] }
base64 = "0.23"
unicode-width = "0.2"
self_update = { version = "1.0.0-rc.6", default-features = false, features = [
    "reqwest",
    "rustls",
    "github",
    "archive-tar",
    "archive-zip",
    "compression-tar-gz",
    "compression-zip-deflate",
    "checksums",
] }
tempfile = "3"
# `default-features = false` drops the default `image-data` feature (and its
# `image`/`objc2-core-graphics`/etc. transitive deps) — shiki only ever
# copies/pastes plain text through this, never images.
arboard = { version = "3", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true
