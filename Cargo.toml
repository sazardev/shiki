[workspace]
resolver = "2"
members = [
    "shiki-core",
    "shiki-config",
    "shiki-tui",
    "shiki-cli",
    "shiki-native-host",
]

[workspace.package]
version = "0.9.2"
edition = "2021"
authors = ["Omar"]
license = "MIT"
repository = "https://github.com/sazardev/shiki"
description = "shiki (私記) - TUI note-taking app written in Rust"
keywords = ["notes", "tui", "markdown", "git", "cli"]
categories = ["command-line-utilities", "text-editors"]

[workspace.dependencies]
shiki-core = { path = "shiki-core", version = "0.9.2" }
shiki-config = { path = "shiki-config", version = "0.9.2" }
shiki-tui = { path = "shiki-tui", version = "0.9.2" }

ratatui = "0.30"
crossterm = "0.29"
tokio = { version = "1", features = ["full"] }
git2 = { version = "0.21", features = ["ssh", "https", "vendored-libgit2", "vendored-openssl"] }
comrak = "0.54"
syntect = "5"
# Bundles ~150 extra syntect syntax definitions (from bat's asset collection)
# on top of syntect's own bundled defaults — notably TypeScript/TSX, which
# syntect's `SyntaxSet::load_defaults_newlines` doesn't include at all, so a
# ```tsx fence fell back to flat dimmed text with no per-token color before
# this. `default-features = false` + `syntect-fancy` picks the same
# fancy-regex backend `syntect` above already defaults to (not `syntect-onig`,
# which needs a C regex engine) so the two crates share one syntect build
# instead of pulling in both regex backends.
two-face = { version = "0.5", default-features = false, features = [
    "syntect-fancy",
] }
ratatui-textarea = "0.9"
nucleo-matcher = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
notify = "6"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
pulldown-cmark = "0.13"
anyhow = "1"
thiserror = "2"
directories = "6"
uuid = { version = "1", features = ["v4"] }
base64 = "0.23"
unicode-width = "0.2"
self_update = { version = "1.0.0-rc.6", default-features = false, features = [
    "reqwest",
    "rustls",
    "github",
    "archive-tar",
    "archive-zip",
    "compression-tar-gz",
    "compression-zip-deflate",
    "checksums",
] }
tempfile = "3"
# `default-features = false` drops the default `image-data` feature (and its
# `image`/`objc2-core-graphics`/etc. transitive deps) — shiki only ever
# copies/pastes plain text through this, never images.
arboard = { version = "3", default-features = false }
# age::scrypt — symmetric passphrase-based encryption for `[notebooks.<name>]
# encrypt = true`. Pure-Rust, no system libsodium/openssl dependency. The
# `armor` feature is required for ASCII-armored output (so ciphertext still
# reads as text to git, not a binary blob).
age = { version = "0.12", features = ["armor"] }
# Hidden passphrase input for `shiki notebook encrypt/decrypt` — the CLI
# equivalent of the TUI's masked passphrase prompt.
rpassword = "7"

[profile.release]
lto = true
codegen-units = 1
strip = true
