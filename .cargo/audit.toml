# Config for `cargo audit` (.github/workflows/ci.yml's `audit` job).
#
# Without this file, a future RUSTSEC advisory against a dependency with no
# upstream fix yet (e.g. one of the transitive advisories CLAUDE.md already
# notes exist via syntect/ratatui) would hard-block every merge indefinitely,
# with no configured way to say "known, tracked, not fixable from our own
# Cargo.toml." Add the advisory ID here with a comment explaining why it's
# safe to ignore for now, and a reminder to remove the entry once an upstream
# fix actually lands.
#
# Example:
# [advisories]
# ignore = [
#     "RUSTSEC-0000-0000", # unmaintained transitive dep via X, no direct usage of the affected API — tracked in issue #NNN
# ]

[advisories]
ignore = [
    # zip <9 `extract()` follows symlinks / keeps SUID bits. The remaining copies are transitive
    # (self_update pins zip 8; the 4.x copy comes from another upstream dep) — upstream hasn't
    # moved to zip 9 yet. shiki's own direct use (shiki-cli's Notion import) is on zip 9, and
    # self_update only extracts shiki's own release asset after a sha256 digest check.
    # Remove these three once self_update / the other dependent release with zip >= 9.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    # crypto-bigint 0.5.5 timing variability, via age -> p256/elliptic-curve (and hpke). Needs
    # >= 0.7.6, a semver-incompatible bump that only upstream age can take. Remove once age updates.
    "RUSTSEC-2026-0387",
]
